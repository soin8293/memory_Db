[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-memorydb"
version = "0.2.0"
description = "Local-first hybrid memory system for AI agents (JSONL ledger + semantic/keyword recall)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "AmirahCo"}
]
keywords = ["rag", "memory", "agent", "openclaw", "codex", "claude"]
dependencies = []

[project.urls]
Homepage = "https://github.com/soin8293/memory_Db"
Repository = "https://github.com/soin8293/memory_Db"
Issues = "https://github.com/soin8293/memory_Db/issues"

[project.optional-dependencies]
semantic = ["faiss-cpu>=1.7.0", "numpy>=1.20.0", "fastembed>=0.1.0"]

[project.scripts]
memorydb = "memory_system.memorydb:cli"

[tool.setuptools]
packages = ["memory_system"]
include-package-data = true

[tool.setuptools.package-data]
memory_system = ["tools/*", "policy/*", "docs/*", "templates/*", "*.md", "*.json"]
