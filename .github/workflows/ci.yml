name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  python-unit-tests:
    name: Python unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run Python unit tests
        run: python -m unittest discover -s memory_system/tests -p "test_*.py"

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: |
          bash memory_system/tests/run_all.sh

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify installed wheel outside checkout
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "${{ runner.temp }}"
          python -c "from memory_system.embeddings.factory import get_embedder; from memory_system.tools import recall; assert get_embedder('hash').embed_texts(['fixture']).vectors"
          memorydb --help
